<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清理缓存</title>
<style>
  body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #FAF8F5; color: #4A3728; }
  .box { text-align: center; padding: 2rem; }
  .icon { font-size: 3rem; margin-bottom: 1rem; }
  .msg { font-size: 1rem; margin-bottom: 0.5rem; }
  .sub { font-size: 0.8rem; color: #9B8C7C; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🧹</div>
  <div class="msg" id="status">正在清理缓存...</div>
  <div class="sub" id="detail"></div>
</div>
<script>
(async () => {
  const status = document.getElementById('status');
  const detail = document.getElementById('detail');
  try {
    // 1. Unregister all service workers
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const reg of regs) {
      await reg.unregister();
    }
    detail.textContent = `已注销 ${regs.length} 个 Service Worker`;

    // 2. Clear all caches
    const keys = await caches.keys();
    for (const key of keys) {
      await caches.delete(key);
    }
    detail.textContent += `，已清除 ${keys.length} 个缓存`;

    // 3. Done
    status.textContent = '✅ 清理完成';
    detail.textContent += '。3秒后跳转回首页...';

    setTimeout(() => {
      window.location.href = './index.html';
    }, 3000);
  } catch (e) {
    status.textContent = '❌ 清理失败';
    detail.textContent = e.message;
  }
})();
</script>
</body>
</html>
